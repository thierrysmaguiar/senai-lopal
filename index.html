<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lopal - Senai</h1>
    <script>
        // console.log("Olá você!")
        // alert("Olá, você!")
        // "10" -> 10

        let num_one = Number(prompt("digite o primeiro numero"))
        let num_two = Number(prompt("digite o segundo numero"))

        console.log(typeof num_one)
        console.log(typeof num_two)

        let sum = num_one + num_two

        alert("soma: " + sum)
        console.log("soma: " + sum)

        let sub = num_one - num_two

        alert("subtração: " + sub)
        console.log("subtração: " + sub)

        let mut = num_one * num_two

        alert("multiplicação: " + mut)
        console.log("multiplicação: " + mut)

        let div = num_one / num_two

        alert("divisão: " + div)
        console.log("divisão: " + div)

        let pot = num_one ** num_two

        alert("potenciação: " + pot)
        console.log("potenciação: " + pot)

    </script>
</body>
</html>
